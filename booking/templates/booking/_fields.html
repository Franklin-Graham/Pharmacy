{% for field in form %}
<div class="field wide{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% for e in field.errors %}<p class="err" role="alert">{{ e }}</p>{% endfor %}
  {% if field.help_text %}<p class="hint">{{ field.help_text|safe }}</p>{% endif %}
</div>
{% endfor %}
{% for e in form.non_field_errors %}<p class="err wide" role="alert">{{ e }}</p>{% endfor %}
