{% extends "booking/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="hero slim"><h1>Welcome back.</h1><p>Log in to place an order and track it.</p></section>
<section class="panel narrow">
  <form method="post" novalidate class="grid">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "booking/_fields.html" %}
    <button type="submit" class="btn wide">Log in</button>
    <p class="wide alt">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </form>
</section>
{% endblock %}
