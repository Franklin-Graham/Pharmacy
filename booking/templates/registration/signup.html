{% extends "booking/base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="hero slim"><h1>Create your account.</h1><p>One account lets you order faster and track every order.</p></section>
<section class="panel narrow">
  <form method="post" novalidate class="grid">
    {% csrf_token %}
    {% include "booking/_fields.html" %}
    <button type="submit" class="btn wide">Create account</button>
    <p class="wide alt">Already registered? <a href="{% url 'login' %}">Log in</a></p>
  </form>
</section>
{% endblock %}
