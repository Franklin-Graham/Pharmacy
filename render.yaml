services:
  - type: web
    name: aysha-pharmacy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn briyani_site.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: aysha-pharmacy-db
          property: connectionString
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_ACCOUNT_ID
        sync: false
      - key: SALESFORCE_LOGIN_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: aysha-pharmacy-db
    databaseName: aysha_pharmacy
    user: aysha_pharmacy
    plan: free
